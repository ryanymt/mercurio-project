name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded runs on other branches are cancelled; every push to main gets a complete run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Lint
        run: make lint
      - name: Build
        run: make build
      # A throwaway postgres:17 in Docker; tests that need it fail rather than skip without it.
      - name: Test
        run: make test

  terraform:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.1
      # No cloud credentials in CI: format and validate only, without the state backend.
      - name: Init (no backend)
        run: terraform init -backend=false -input=false
      - name: Format
        run: terraform fmt -check -recursive
      - name: Validate
        run: terraform validate
